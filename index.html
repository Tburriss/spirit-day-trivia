<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spirit Day Trivia with Manny</title>
<style>
:root{--accent:#ea580c;--accent2:#16a34a;--bg1:#431407;--bg2:#14532d;--ink:#172033;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}button,input{font:inherit}.app{width:min(980px,94vw);margin:auto;padding:28px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;margin-bottom:16px;font-weight:800}.badge{background:#ffffff20;border:1px solid #ffffff45;border-radius:999px;padding:9px 14px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:28px;padding:clamp(20px,4vw,42px);box-shadow:0 25px 70px #0005}.hero{text-align:center}.manny-image{display:block;width:min(760px,100%);max-height:56vh;object-fit:contain;margin:0 auto 20px;border-radius:20px}.features,.row,.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.features{margin:12px 0 24px}.feature,.scorebox{background:#f1f5f9;border-radius:999px;padding:9px 14px;font-weight:800}input{min-width:min(320px,100%);padding:14px 16px;border-radius:14px;border:2px solid #cbd5e1}.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:900;color:#fff;background:var(--accent);cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn:focus-visible,.answer:focus-visible,input:focus-visible{outline:4px solid #facc15;outline-offset:3px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timer{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent2);font-size:26px;font-weight:900}.progress{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:18px 0 30px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .25s}.label{display:inline-block;padding:7px 12px;border-radius:999px;background:#e2e8f0;font-weight:900}.hard{background:#fef3c7;color:#92400e}.question{font-size:clamp(26px,4vw,40px)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{min-height:72px;border:3px solid transparent;border-radius:16px;padding:14px;text-align:left;font-weight:800;background:#f1f5f9;cursor:pointer}.answer:hover:not(:disabled){background:#e2e8f0}.answer.correct{background:#dcfce7;border-color:#22c55e}.answer.wrong{background:#fee2e2;border-color:#ef4444}.feedback{min-height:52px;margin:16px 0;font-size:18px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.right{text-align:right}.hidden{display:none!important}.big{font-size:clamp(54px,12vw,104px);color:var(--accent);font-weight:1000}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:#f1f5f9;border-radius:16px;padding:16px;text-align:center}.stat strong{display:block;font-size:28px}.footer{text-align:center;color:#fff;margin-top:14px}.confetti{position:fixed;top:-20px;width:11px;height:17px;animation:fall 2.7s linear forwards;z-index:10001}.overlay{position:fixed;inset:0;background:rgba(8,10,28,.88);display:none;place-items:center;padding:18px;z-index:10000}.overlay.active{display:grid}.overlay-panel{width:min(860px,96vw);text-align:center}.overlay-image{display:block;max-width:100%;max-height:76vh;object-fit:contain;margin:auto;border-radius:22px;box-shadow:0 24px 70px #0009}.overlay-actions{margin-top:14px}.notice{color:#fff;font-weight:800;margin:0 0 12px}.restore-box{margin:16px auto 0;padding:14px;max-width:700px;background:#f8fafc;border-radius:14px}.restore-box p{margin:0 0 10px}.result-wrap{position:relative}.result-image{display:block;width:auto;max-width:100%;max-height:55vh;object-fit:contain;margin:auto;border-radius:20px;}.result-panel{margin:18px auto 0}.warning{background:#fff7ed;color:#9a3412;border:2px solid #fdba74;border-radius:14px;padding:12px;margin:0 0 18px;font-weight:800}
@keyframes fall{to{transform:translateY(110vh) rotate(650deg)}}
@media(max-width:680px){.top{align-items:flex-start;flex-direction:column}.answers,.stats{grid-template-columns:1fr}.timer{width:60px;height:60px}.manny-image{max-height:45vh}}
body{background-color:#101827!important;background-image:linear-gradient(rgba(8,10,28,.30),rgba(8,10,28,.58)),url("Manny-Background.png")!important;background-size:cover!important;background-position:center!important;background-attachment:fixed!important}
.card{background:rgba(255,255,255,.96)!important;backdrop-filter:blur(7px);border:2px solid rgba(255,255,255,.4)}
.top{text-shadow:0 2px 7px #000}
.btn{background:#ea580c!important}
.timer{background:#16a34a!important}
.bar{background:linear-gradient(90deg,#ea580c,#16a34a)!important}
</style>
</head>
<body>
<main class="app">
  <div class="top"><span>CUSTOMER SERVICE WEEK TRIVIA</span><span class="badge">Spirit Day</span></div>

  <section id="welcome" class="screen active">
    <div class="card hero">
      <img class="manny-image" src="Welcome.png" alt="Manny the Managed WiFi Manatee welcome screen">
      <div id="restoreBox" class="restore-box hidden">
        <p id="restoreText"></p>
        <div class="row"><button class="btn" id="resume">Resume Game</button></div>
      </div>
      <div id="newGameBox">
        <div class="features"><span class="feature">15 Questions</span><span class="feature">Timed Scoring</span></div>
        <div class="row"><input id="name" maxlength="24" autocomplete="off" placeholder="Enter player or team name"><button class="btn" id="start">Start Game</button></div>
      </div>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="card">
      <div id="integrityWarning" class="warning hidden">Game focus changed while a question was active. This attempt has been marked for review, but progress was preserved.</div>
      <div class="head"><div class="scores"><span class="scorebox" id="player">Player</span><span class="scorebox">Score: <b id="score">0</b></span><span class="scorebox">Streak: <b id="streak">0</b></span></div><div class="timer" id="timer">15</div></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <span class="label" id="label">Question</span>
      <h2 class="question" id="question"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="right"><button class="btn hidden" id="next">Next</button></div>
    </div>
  </section>

  <section id="results" class="screen">
    <div class="card hero">
      <div class="result-wrap"><img class="result-image" src="Final.png" alt="Manny final score celebration screen"></div>
      <div class="result-panel"><div class="big" id="final">0</div><p id="resultName"></p><div class="stats"><div class="stat"><strong id="correct">0</strong>Correct</div><div class="stat"><strong id="accuracy">0%</strong>Accuracy</div><div class="stat"><strong id="best">0</strong>Best Streak</div></div></div>
    </div>
  </section>
  <div class="footer">Spirit Day • Customer Service Week Event</div>
</main>

<div id="mannyOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayMessage">
  <div class="overlay-panel"><p id="overlayMessage" class="notice"></p><img id="overlayImage" class="overlay-image" alt=""><div class="overlay-actions"><button class="btn" id="overlayContinue">Continue</button></div></div>
</div>

<script>
const questions=[{"q":"Which flag signals the end of an auto race?","a":["Green","Yellow","Red","Checkered"],"x":3,"e":"The checkered flag marks the finish.","cat":"Sports & Esports"},{"q":"Which movie features a theme park populated by cloned dinosaurs?","a":["King Kong","Jurassic Park","Jumanji","The Lost World (1960)"],"x":1,"e":"Jurassic Park centers on a theme park populated by cloned dinosaurs.","cat":"Entertainment"},{"q":"Before ending a support interaction, what should be confirmed?","a":["The customer knows the resolution or next steps and ownership","The call was under five minutes","No notes are needed","A transfer will always occur"],"x":0,"e":"A strong close confirms the result, next steps, and ownership.","cat":"Customer Service"},{"q":"In baseball, how many strikes normally result in a strikeout?","a":["2","3","4","5"],"x":1,"e":"Three strikes normally result in a strikeout.","cat":"Sports & Esports"},{"q":"Which video game character is known for collecting rings?","a":["Sonic the Hedgehog","Kirby","Link","Samus Aran"],"x":0,"e":"Rings are a signature collectible in Sonic the Hedgehog games.","cat":"Entertainment"},{"q":"When should a support issue be escalated?","a":["Before troubleshooting","When defined escalation criteria are met after required validation","Whenever a customer asks any question","Only after closing the ticket"],"x":1,"e":"Escalation should follow the approved criteria and required validation path.","cat":"Customer Service"},{"q":"In soccer, which player may normally use hands inside the penalty area?","a":["Striker","Captain","Goalkeeper","Center back"],"x":2,"e":"The goalkeeper may normally handle the ball inside the team’s own penalty area.","cat":"Sports & Esports"},{"q":"Which company created the PlayStation brand?","a":["Nintendo","Sega","Sony","Microsoft"],"x":2,"e":"Sony launched the PlayStation brand.","cat":"Entertainment"},{"q":"What is the strongest warm handoff?","a":["Transfer without notes","Introduce the receiving team and summarize the issue, work completed, and next need","Tell the customer to start over","Close the case first"],"x":1,"e":"A warm handoff preserves context and ownership.","cat":"Customer Service"},{"q":"In what year did Nintendo release the Famicom in Japan?","a":["1982","1983","1984","1985"],"x":1,"e":"Nintendo released the Famicom in 1983.","cat":"Entertainment"},{"q":"Which esports title uses a map called Summoner's Rift?","a":["Dota 2","League of Legends","VALORANT","Overwatch 2"],"x":1,"e":"Summoner's Rift is the primary competitive map used in League of Legends professional play.","cat":"Sports & Esports"},{"q":"What trophy is awarded to the League of Legends World Championship winner?","a":["Summoner’s Cup","Aegis of Champions","Stanley Cup","Webb Ellis Cup"],"x":0,"e":"The winner receives the Summoner’s Cup.","cat":"Sports & Esports"},{"q":"Which sequel was the first to win the Academy Award for Best Picture?","a":["The Godfather Part II","The Lord of the Rings: The Return of the King","Toy Story 3","Top Gun: Maverick"],"x":0,"e":"The Godfather Part II was the first sequel to win Best Picture.","cat":"Entertainment"},{"q":"Which metric uses promoters, passives, and detractors?","a":["CSAT","CES","NPS","FCR"],"x":2,"e":"NPS classifies respondents as promoters, passives, or detractors.","cat":"Customer Service"},{"q":"CHALLENGE: Under international FIBA rules, after an offensive rebound the shot clock normally resets to how many seconds?","a":["24","20","16","14"],"x":3,"e":"Under FIBA rules, the shot clock normally resets to 14 seconds after an offensive rebound.","cat":"Challenge","hard":true}];
const completionKey='spiritDay15Completed';
const progressKey=completionKey+'_progress_v2';
const integrityKey=completionKey+'_integrity';
const $=id=>document.getElementById(id);
let s={i:0,score:0,streak:0,best:0,correct:0,name:'Player',time:15,locked:false,timer:null,bonusShown:false,integrity:false};
let overlayCallback=null;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'instant'})}
function snapshot(){return {i:s.i,score:s.score,streak:s.streak,best:s.best,correct:s.correct,name:s.name,time:s.time,bonusShown:s.bonusShown,integrity:s.integrity,locked:s.locked,version:2}}
function saveProgress(){if(localStorage.getItem(completionKey)==='true')return;localStorage.setItem(progressKey,JSON.stringify(snapshot()))}
function clearProgress(){localStorage.removeItem(progressKey)}
function getSavedProgress(){try{const p=JSON.parse(localStorage.getItem(progressKey)||'null');return p&&Number.isInteger(p.i)&&p.i>=0&&p.i<questions.length?p:null}catch{return null}}
function updateHud(){$('player').textContent=s.name;$('score').textContent=s.score;$('streak').textContent=s.streak;$('integrityWarning').classList.toggle('hidden',!s.integrity)}
function showManny(image,message,alt,callback){clearInterval(s.timer);overlayCallback=callback||null;$('overlayImage').src=image;$('overlayImage').alt=alt;$('overlayMessage').textContent=message||'';$('mannyOverlay').classList.add('active');$('overlayContinue').focus()}
function closeManny(){$('mannyOverlay').classList.remove('active');const cb=overlayCallback;overlayCallback=null;if(cb)cb()}
function fillResults(n,sc,c,b){$('final').textContent=Number(sc).toLocaleString();$('resultName').textContent='Great game, '+n+'!';$('correct').textContent=c+'/'+questions.length;$('accuracy').textContent=Math.round(c/questions.length*100)+'%';$('best').textContent=b}
function checkCompletion(){if(localStorage.getItem(completionKey)!=='true')return false;fillResults(localStorage.getItem(completionKey+'_name')||'Player',Number(localStorage.getItem(completionKey+'_score')||0),Number(localStorage.getItem(completionKey+'_correct')||0),Number(localStorage.getItem(completionKey+'_best')||0));show('results');return true}
function prepareWelcome(){const p=getSavedProgress();if(!p)return;$('restoreText').textContent='A saved game was found for '+(p.name||'Player')+' at question '+(p.i+1)+' of '+questions.length+'.';$('restoreBox').classList.remove('hidden');$('newGameBox').classList.add('hidden')}
function start(){clearProgress();s={i:0,score:0,streak:0,best:0,correct:0,name:$('name').value.trim()||'Player',time:15,locked:false,timer:null,bonusShown:false,integrity:false};updateHud();saveProgress();show('game');render()}
function resume(){const p=getSavedProgress();if(!p){show('welcome');prepareWelcome();return}s={...s,...p,timer:null,locked:false};updateHud();show('game');render()}
function render(){clearInterval(s.timer);s.locked=false;const q=questions[s.i];if(q.hard&&!s.bonusShown){s.bonusShown=true;saveProgress();showManny('Bonus.png','Bonus round unlocked.','Manny bonus challenge screen',render);return}$('bar').style.width=((s.i)/questions.length*100)+'%';$('label').textContent=q.hard?'Challenge Question':q.cat+' • Question '+(s.i+1)+' of '+questions.length;$('label').className='label'+(q.hard?' hard':'');$('question').textContent=q.q;$('answers').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');q.a.forEach((t,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+t;b.onclick=()=>answer(i);$('answers').appendChild(b)});s.time=q.hard?25:15;draw();saveProgress();s.timer=setInterval(()=>{s.time--;draw();saveProgress();if(s.time<=0)answer(-1)},1000)}
function draw(){$('timer').textContent=s.time;$('timer').style.background=s.time<=5?'#dc2626':'var(--accent2)'}
function answer(i){if(s.locked)return;s.locked=true;clearInterval(s.timer);const q=questions[s.i],bs=[...$('answers').children];bs.forEach((b,n)=>{b.disabled=true;if(n===q.x)b.classList.add('correct');if(n===i&&i!==q.x)b.classList.add('wrong')});let image,message,alt;if(i===q.x){s.correct++;s.streak++;s.best=Math.max(s.best,s.streak);let p=q.hard?300:100;p+=s.time>=10?50:s.time>=5?25:0;s.score+=p;$('feedback').textContent='Correct! +'+p+' points. '+q.e;$('feedback').className='feedback good';image='Correct.png';message='Correct answer';alt='Manny correct answer screen';pop(15)}else{s.streak=0;$('feedback').textContent=(i<0?'Time is up! ':'Not quite. ')+q.e;$('feedback').className='feedback bad';image='Incorrect.png';message=i<0?'Time is up':'Incorrect answer';alt='Manny incorrect answer screen'}updateHud();$('next').textContent=s.i===questions.length-1?'See Results':'Next';$('next').classList.remove('hidden');saveProgress();showManny(image,message,alt,()=>{$('next').focus()})}
function next(){s.i++;if(s.i>=questions.length){finish()}else{saveProgress();render()}}
function finish(){clearInterval(s.timer);localStorage.setItem(completionKey,'true');localStorage.setItem(completionKey+'_score',String(s.score));localStorage.setItem(completionKey+'_correct',String(s.correct));localStorage.setItem(completionKey+'_best',String(s.best));localStorage.setItem(completionKey+'_name',s.name);localStorage.setItem(integrityKey,JSON.stringify({flagged:s.integrity,completed:new Date().toISOString()}));clearProgress();fillResults(s.name,s.score,s.correct,s.best);show('results');pop(60)}
function markIntegrity(){if(!$('game').classList.contains('active')||s.locked||$('mannyOverlay').classList.contains('active'))return;s.integrity=true;updateHud();saveProgress()}
function pop(n){const c=['#facc15','#22c55e','#38bdf8','#f97316','#ec4899'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
$('start').onclick=start;$('resume').onclick=resume;$('overlayContinue').onclick=closeManny;$('name').onkeydown=e=>{if(e.key==='Enter')start()};$('next').onclick=next;
document.addEventListener('visibilitychange',()=>{if(document.hidden)markIntegrity()});window.addEventListener('blur',markIntegrity);window.addEventListener('beforeunload',saveProgress);
if(!checkCompletion())prepareWelcome();
</script>
</body>
</html>
