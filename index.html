<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spirit Day Trivia</title>
<style>
:root{--accent:#ea580c;--accent2:#16a34a;--bg1:#431407;--bg2:#14532d;--ink:#172033;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));}button,input{font:inherit}.app{width:min(980px,94vw);margin:auto;padding:28px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;color:white;margin-bottom:16px;font-weight:800}.badge{background:#ffffff20;border:1px solid #ffffff45;border-radius:999px;padding:9px 14px}.screen{display:none}.screen.active{display:block;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(9px)}}.card{background:#fff;border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 25px 70px #0005}.hero{text-align:center}.icon{font-size:76px}h1{font-size:clamp(42px,8vw,76px);line-height:.98;margin:12px 0;color:var(--accent)}.sub{font-size:clamp(19px,3vw,27px);color:#475569}.features{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px 0}.feature,.scorebox{background:#f1f5f9;border-radius:999px;padding:9px 14px;font-weight:800}.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}input{min-width:240px;padding:14px 16px;border-radius:14px;border:2px solid #cbd5e1}.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:900;color:white;background:var(--accent);cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--accent),black 28%)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #333}.secondary{color:var(--accent);background:#fff;border:2px solid var(--accent);box-shadow:none}.head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.scores{display:flex;gap:8px;flex-wrap:wrap}.timer{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:white;background:var(--accent2);font-size:26px;font-weight:900}.progress{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:18px 0 30px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}.label{display:inline-block;padding:7px 12px;border-radius:999px;background:#e2e8f0;font-weight:900}.hard{background:#fef3c7;color:#92400e}.question{font-size:clamp(26px,4vw,40px);color:#0f172a}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{min-height:72px;border:3px solid transparent;border-radius:16px;padding:14px;text-align:left;font-weight:800;background:#f1f5f9;cursor:pointer}.answer:hover:not(:disabled){border-color:var(--accent)}.answer.correct{background:#dcfce7;border-color:#22c55e}.answer.wrong{background:#fee2e2;border-color:#ef4444}.feedback{min-height:52px;margin:16px 0;font-size:18px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.right{text-align:right}.hidden{display:none!important}.big{font-size:clamp(65px,14vw,120px);color:var(--accent);font-weight:1000}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:#f1f5f9;border-radius:16px;padding:16px;text-align:center}.stat strong{display:block;font-size:28px}.leaders{display:grid;gap:8px;margin:22px 0}.leader{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:14px;align-items:center;font-weight:800}.footer{text-align:center;color:#fff;margin-top:14px}.confetti{position:fixed;top:-20px;width:11px;height:17px;animation:fall 2.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(650deg)}}@media(max-width:680px){.answers{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style></head><body><main class="app"><div class="top"><span>CUSTOMER SERVICE WEEK TRIVIA</span><span class="badge">🏆 Spirit Day</span></div>
<section id="welcome" class="screen active"><div class="card hero"><div class="icon">🏆</div><h1>Spirit Day</h1><p class="sub">Customer Service Week Trivia</p><div class="features"><span class="feature">Mixed Categories</span><span class="feature">1 Challenge Question</span><span class="feature">Timed Scoring</span></div><div class="row"><input id="name" maxlength="24" placeholder="Enter player or team name"><button class="btn" id="start">Start Game ▶</button></div></div></section>
<section id="game" class="screen"><div class="card"><div class="head"><div class="scores"><span class="scorebox" id="player">Player</span><span class="scorebox">Score: <b id="score">0</b></span><span class="scorebox">Streak: <b id="streak">0</b></span></div><div class="timer" id="timer">15</div></div><div class="progress"><div class="bar" id="bar"></div></div><span class="label" id="label">Question</span><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="right"><button class="btn hidden" id="next">Next ▶</button></div></div></section>
<section id="results" class="screen"><div class="card hero"><div class="icon">🏆</div><h1>Final Score</h1><div class="big" id="final">0</div><p class="sub" id="resultName"></p><div class="stats"><div class="stat"><strong id="correct">0</strong>Correct</div><div class="stat"><strong id="accuracy">0%</strong>Accuracy</div><div class="stat"><strong id="best">0</strong>Best Streak</div></div><div class="row"></div></div></section>
<section id="leaders" class="screen"><div class="card"><h1>Leaderboard</h1><div class="leaders" id="list"></div><div class="row"><button class="btn" id="back">Back</button><button class="btn secondary" id="clear">Clear Scores</button></div></div></section><div class="footer">Spirit Day • Customer Service Week Event</div></main>
<script>
const questions=[{"q": "Which flag signals the end of an auto race?", "a": ["Green", "Yellow", "Red", "Checkered"], "x": 3, "e": "The checkered flag marks the finish.", "cat": "Sports & Esports"}, {"q": "Which movie features a theme park populated by cloned dinosaurs?", "a": ["King Kong", "Jurassic Park", "Jumanji", "The Lost World (1960)"], "x": 1, "e": "Jurassic Park centers on a theme park populated by cloned dinosaurs.", "cat": "Entertainment"}, {"q": "Before ending a support interaction, what should be confirmed?", "a": ["The customer knows the resolution or next steps and ownership", "The call was under five minutes", "No notes are needed", "A transfer will always occur"], "x": 0, "e": "A strong close confirms the result, next steps, and ownership.", "cat": "Customer Service"}, {"q": "In baseball, how many strikes normally result in a strikeout?", "a": ["2", "3", "4", "5"], "x": 1, "e": "Three strikes normally result in a strikeout.", "cat": "Sports & Esports"}, {"q": "Which video game character is known for collecting rings?", "a": ["Sonic the Hedgehog", "Kirby", "Link", "Samus Aran"], "x": 0, "e": "Rings are a signature collectible in Sonic the Hedgehog games.", "cat": "Entertainment"}, {"q": "When should a support issue be escalated?", "a": ["Before troubleshooting", "When defined escalation criteria are met after required validation", "Whenever a customer asks any question", "Only after closing the ticket"], "x": 1, "e": "Escalation should follow the approved criteria and required validation path.", "cat": "Customer Service"}, {"q": "In soccer, which player may normally use hands inside the penalty area?", "a": ["Striker", "Captain", "Goalkeeper", "Center back"], "x": 2, "e": "The goalkeeper may normally handle the ball inside the team’s own penalty area.", "cat": "Sports & Esports"}, {"q": "Which company created the PlayStation brand?", "a": ["Nintendo", "Sega", "Sony", "Microsoft"], "x": 2, "e": "Sony launched the PlayStation brand.", "cat": "Entertainment"}, {"q": "What is the strongest warm handoff?", "a": ["Transfer without notes", "Introduce the receiving team and summarize the issue, work completed, and next need", "Tell the customer to start over", "Close the case first"], "x": 1, "e": "A warm handoff preserves context and ownership.", "cat": "Customer Service"}, {"q": "CHALLENGE: Under international FIBA rules, after an offensive rebound the shot clock normally resets to how many seconds?", "a": ["24", "20", "16", "14"], "x": 3, "e": "Under FIBA rules, the shot clock normally resets to 14 seconds after an offensive rebound.", "hard": true, "cat": "Challenge"}];const storageKey="spiritDayScores";const completionKey="spiritDayCompleted";
function checkCompletion(){
 if(localStorage.getItem(completionKey)!=="true") return false;
 const savedScore=Number(localStorage.getItem(completionKey+"_score")||0);
 const savedCorrect=Number(localStorage.getItem(completionKey+"_correct")||0);
 const savedBest=Number(localStorage.getItem(completionKey+"_best")||0);
 const savedName=localStorage.getItem(completionKey+"_name")||"Player";
 $('final').textContent=savedScore.toLocaleString();
 $('resultName').textContent='Great game, '+savedName+'!';
 $('correct').textContent=savedCorrect+'/'+questions.length;
 $('accuracy').textContent=Math.round((savedCorrect/questions.length)*100)+'%';
 $('best').textContent=savedBest;
 show('results');
 return true;
}
const $=id=>document.getElementById(id);let s={i:0,score:0,streak:0,best:0,correct:0,name:'Player',time:15,locked:false,timer:null};
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo({top:0,behavior:'smooth'})}
function start(){s={i:0,score:0,streak:0,best:0,correct:0,name:$('name').value.trim()||'Player',time:15,locked:false,timer:null};$('player').textContent=s.name;$('score').textContent=0;$('streak').textContent=0;show('game');render()}
function render(){clearInterval(s.timer);s.locked=false;const q=questions[s.i];$('bar').style.width=(s.i/questions.length*100)+'%';$('label').textContent=q.hard?'★ Challenge Question':q.cat+' • Question '+(s.i+1)+' of '+questions.length;$('label').className='label'+(q.hard?' hard':'');$('question').textContent=q.q;$('answers').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');q.a.forEach((t,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+t;b.onclick=()=>answer(i);$('answers').appendChild(b)});s.time=q.hard?25:15;draw();s.timer=setInterval(()=>{s.time--;draw();if(s.time<=0)answer(-1)},1000)}
function draw(){$('timer').textContent=s.time;$('timer').style.background=s.time<=5?'#dc2626':'var(--accent2)'}
function answer(i){if(s.locked)return;s.locked=true;clearInterval(s.timer);const q=questions[s.i],bs=[...$('answers').children];bs.forEach((b,n)=>{b.disabled=true;if(n===q.x)b.classList.add('correct');if(n===i&&i!==q.x)b.classList.add('wrong')});if(i===q.x){s.correct++;s.streak++;s.best=Math.max(s.best,s.streak);let p=q.hard?300:100;p+=s.time>=10?50:s.time>=5?25:0;s.score+=p;$('feedback').textContent='Correct! +'+p+' points. '+q.e;$('feedback').className='feedback good';pop(q.hard?35:15)}else{s.streak=0;$('feedback').textContent=(i<0?'Time is up! ':'Not quite. ')+q.e;$('feedback').className='feedback bad'}$('score').textContent=s.score;$('streak').textContent=s.streak;$('next').textContent=s.i===questions.length-1?'See Results 🏆':'Next ▶';$('next').classList.remove('hidden')}
function next(){s.i++;s.i>=questions.length?finish():render()}function getScores(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return[]}}function save(){const a=getScores();a.push({name:s.name,score:s.score,correct:s.correct,date:new Date().toLocaleDateString()});a.sort((x,y)=>y.score-x.score);localStorage.setItem(storageKey,JSON.stringify(a.slice(0,10)))}
function finish(){
 localStorage.setItem(completionKey,"true");
 localStorage.setItem(completionKey+"_score",String(s.score));
 localStorage.setItem(completionKey+"_correct",String(s.correct));
 localStorage.setItem(completionKey+"_best",String(s.best));
 localStorage.setItem(completionKey+"_name",s.name);
 save();$('final').textContent=s.score.toLocaleString();$('resultName').textContent='Great game, '+s.name+'!';$('correct').textContent=s.correct+'/'+questions.length;$('accuracy').textContent=Math.round(s.correct/questions.length*100)+'%';$('best').textContent=s.best;show('results');pop(60)}
function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function leaders(){const a=getScores();$('list').innerHTML=a.length?a.map((r,i)=>`<div class="leader"><span>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span><span>${esc(r.name)}<small style="display:block;color:#64748b">${r.correct}/${questions.length} correct • ${r.date}</small></span><strong>${Number(r.score).toLocaleString()}</strong></div>`).join(''):'<p>No scores yet.</p>';show('leaders')}function pop(n){const c=['#facc15','#22c55e','#38bdf8','#f97316','#ec4899'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}}
$('start').onclick=start;$('name').onkeydown=e=>{if(e.key==='Enter')start()};$('next').onclick=next;
checkCompletion();
</script></body></html>
